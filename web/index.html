<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<title>全国ゴルフ場検索 powered by LAYR GOLF</title>
<meta name="description" content="行きたいゴルフのイメージを文章で。全国のゴルフ場を写真・料金・評価・服装情報から探せます。">
<link rel="stylesheet" href="/assets/styles.css?v=select-20261004">
</head>
<body class="home">
<header class="topbar">
  <a class="brand" href="/">
    <strong>全国ゴルフ場検索</strong>
    <small>powered by LAYR GOLF</small>
  </a>
</header>

<main>
  <section class="hero">
    <div class="hero-copy">
      <p class="hero-index">全国 2,278 コース</p>
      <h1>行きたいゴルフを、<br>そのまま書く。</h1>
      <p class="hero-lead">場所、メンバー、予算、気分。条件を選ぶのではなく、次の一日を文章で伝えてください。</p>
    </div>

    <form id="searchForm" class="search-panel" role="search">
      <label for="query">どんなゴルフにしたい？</label>
      <div class="sentence-row">
        <textarea id="query" rows="2" maxlength="500" autocomplete="off" placeholder="大阪から1時間くらい。初心者も一緒で、景色がよくて、土日1.3万円以内。"></textarea>
        <button class="search-submit" type="submit">探す <span aria-hidden="true">→</span></button>
      </div>
      <p class="search-help">ゴルフ場名を知らなくても検索できます。</p>
    </form>
  </section>

  <section class="catalog" id="catalog" aria-labelledby="resultTitle" aria-busy="true">
    <div class="catalog-head">
      <div>
        <p class="eyebrow" id="resultEyebrow">COURSE LIST</p>
        <h2 id="resultTitle">ゴルフ場を選ぶ。</h2>
        <p id="activeFilters" class="interpreted"></p>
      </div>
      <div class="catalog-tools">
        <span id="resultCount" role="status" aria-live="polite"></span>
        <label class="sr-only" for="sortSelect">並び順</label>
        <select id="sortSelect">
          <option value="recommended">おすすめ順</option>
          <option value="rating">評価が高い順</option>
          <option value="weekday_price">平日料金が安い順</option>
          <option value="holiday_price">土日祝料金が安い順</option>
        </select>
      </div>
    </div>

    <div id="results" class="course-list"></div>

    <div id="moreArea" class="more-area" hidden>
      <button id="showAll" type="button">さらに表示 →</button>
    </div>

    <nav id="pager" class="pager" aria-label="検索結果のページ"></nav>
    <p class="catalog-note">料金は取得時点の最安目安です。プレー日・人数・追加料金は予約先でご確認ください。</p>
  </section>
</main>

<footer>
  <a href="https://layrgolf.andmellow.jp/">LAYR GOLF</a>
  <p>写真・コース情報：楽天GORA。服装の記載がない場合も「自由」とは限りません。予約前に最新情報をご確認ください。</p>
</footer>

<script type="module" src="/assets/app.js?v=select-20261004"></script>
</body>
</html>
