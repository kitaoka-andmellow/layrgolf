name: Verify website and affiliate automation

on:
  push:
    branches:
      - main
      - fix/visual-search-affiliate-20261011
    paths:
      - "web/**"
      - "worker/scripts/sync_ichiba_affiliate.py"
      - "worker/tests/**"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "web/**"
      - "worker/scripts/sync_ichiba_affiliate.py"
      - "worker/tests/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test natural language, course pages and sitemap
        working-directory: web
        run: npm test
  affiliate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python 3.7 grammar compatibility
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("worker/scripts/sync_ichiba_affiliate.py")
          ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3,7))
          print("Python 3.7 syntax compatible")
          PY
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run offline affiliate unit tests
        run: python -m unittest discover -s worker/tests -p "test_ichiba_affiliate.py"
